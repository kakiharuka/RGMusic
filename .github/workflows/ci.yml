name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lua syntax check
        run: |
          npx --yes luaparse source/RGMusic/app/main.lua
          npx --yes luaparse source/RGMusic/app/controls.lua
          npx --yes luaparse source/RGMusic/app/netease.lua
          npx --yes luaparse source/RGMusic/app/mpv.lua

      - name: Go test
        working-directory: source/RGMusicNetease
        run: go test ./...

      - name: Build ARM64 sidecar
        working-directory: source/RGMusicNetease
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: go build -trimpath -ldflags="-s -w" -o ../../dist/rgmusic-netease.aarch64 .